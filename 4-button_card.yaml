type: custom:button-card
entity: sensor.winter_park_snow_report
name: Last 24h
show_state: false
styles:
  card:
    - height: 100px
    - border-radius: 12px
    - padding: 10px
  grid:
    - grid-template-areas: "\"n\" \"snow_val\""
    - grid-template-rows: 1fr 2fr
    - grid-template-columns: 1fr
  name:
    - font-size: 14px
    - font-weight: 600
    - color: var(--secondary-text-color)
    - align-self: end
    - justify-self: center
  custom_fields:
    snow_val:
      - align-self: start
      - justify-self: center
      - font-size: 32px
      - font-weight: 800
      - color: "#ED9121"
custom_fields:
  snow_val: >
    [[[ return states['sensor.winter_park_snow_report'].attributes.last_24h +
    "\"" ]]]
